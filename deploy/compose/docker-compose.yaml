name: "aspire-ai-stack"
services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    ports:
      - "18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  cache:
    image: "docker.io/library/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${CACHE_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  qdrant:
    image: "docker.io/qdrant/qdrant:v1.18.0"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_KEY}"
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "0"
    expose:
      - "6334"
      - "6333"
    volumes:
      - type: "volume"
        target: "/qdrant/storage"
        source: "aspire-ai-stack-qdrant-data"
        read_only: false
    networks:
      - "aspire"
  ollama:
    image: "docker.io/ollama/ollama:0.32.15"
    expose:
      - "11434"
    volumes:
      - type: "volume"
        target: "/root/.ollama"
        source: "aspire-ai-stack-ollama-data"
        read_only: false
    networks:
      - "aspire"
  apiservice:
    image: "${APISERVICE_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${APISERVICE_PORT}"
      ConnectionStrings__cache: "cache:6379,password=${CACHE_PASSWORD}"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
      CACHE_PASSWORD: "${CACHE_PASSWORD}"
      CACHE_URI: "redis://:${CACHE_PASSWORD}@cache:6379"
      ConnectionStrings__qdrant: "Endpoint=http://qdrant:6334;Key=${QDRANT_KEY}"
      QDRANT_GRPCHOST: "qdrant"
      QDRANT_GRPCPORT: "6334"
      QDRANT_HTTPHOST: "qdrant"
      QDRANT_HTTPPORT: "6333"
      QDRANT_APIKEY: "${QDRANT_KEY}"
      QDRANT_URI: "http://qdrant:6334"
      QDRANT_HTTPURI: "http://qdrant:6333"
      ConnectionStrings__qdrant_http: "Endpoint=http://qdrant:6333;Key=${QDRANT_KEY}"
      ConnectionStrings__ollama: "Endpoint=http://ollama:11434"
      OLLAMA_HOST: "ollama"
      OLLAMA_PORT: "11434"
      OLLAMA_URI: "http://ollama:11434"
      Infrastructure__UseRedis: "true"
      Infrastructure__UseQdrant: "true"
      AI__Mode: "ollama"
      AI__Model: "phi3:mini"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "apiservice"
      DOTNET_ENVIRONMENT: "Development"
    expose:
      - "${APISERVICE_PORT}"
    depends_on:
      cache:
        condition: "service_started"
      qdrant:
        condition: "service_started"
      ollama:
        condition: "service_started"
      chat-model-loader:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
  chat-model-loader:
    image: "ollama/ollama:0.32.15"
    command:
      - "pull"
      - "phi3:mini"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - type: "volume"
        target: "/root/.ollama"
        source: "aspire-ai-stack-ollama-data"
        read_only: false
    depends_on:
      ollama:
        condition: "service_started"
    networks:
      - "aspire"
  webfrontend:
    image: "${WEBFRONTEND_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${WEBFRONTEND_PORT}"
      APISERVICE_HTTP: "http://apiservice:${APISERVICE_PORT}"
      services__apiservice__http__0: "http://apiservice:${APISERVICE_PORT}"
      APISERVICE_HTTPS: "https://apiservice:${APISERVICE_PORT}"
      Demo__DashboardUrl: "http://localhost:18888"
      ConnectionStrings__cache: "cache:6379,password=${CACHE_PASSWORD}"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
      CACHE_PASSWORD: "${CACHE_PASSWORD}"
      CACHE_URI: "redis://:${CACHE_PASSWORD}@cache:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webfrontend"
      DOTNET_ENVIRONMENT: "Development"
    ports:
      - "${WEBFRONTEND_PORT}"
    depends_on:
      apiservice:
        condition: "service_started"
      cache:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  aspire-ai-stack-qdrant-data:
    driver: "local"
  aspire-ai-stack-ollama-data:
    driver: "local"
