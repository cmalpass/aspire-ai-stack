name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPIRE_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AspireAiStack.sln
      - run: dotnet build AspireAiStack.sln --configuration Release --no-restore
      - run: dotnet test AspireAiStack.sln --configuration Release --no-build --logger "console;verbosity=minimal"
