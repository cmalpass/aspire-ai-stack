name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPIRE_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AspireAiStack.sln
      - run: dotnet build AspireAiStack.sln --configuration Release --no-restore
      - name: Install Chromium
        run: pwsh AspireAiStack.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run tests
        env:
          EVIDENCE_OUTPUT_DIR: ${{ github.workspace }}/TestResults/browser-smoke
        run: dotnet test AspireAiStack.sln --configuration Release --no-build --logger "console;verbosity=minimal" --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-evidence
          path: TestResults
          if-no-files-found: error
          retention-days: 14
